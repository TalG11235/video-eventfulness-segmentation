task: ddtr

model:
  input_type: frames
  feature_dim: 512
  resnet_name: resnet18
  resnet_pretrained: false
  temporal_dim: 256
  ms_kernel_sizes: [3, 5, 7]
  ms_dilations: [1, 2, 3]
  num_actions: 50
  dropout: 0.1

data:
  dataset: ddtr_logs
  manifest_train: data/ddtr/train.jsonl
  manifest_val: data/ddtr/val.jsonl
  clip_len: 128
  random_start: true
  input_type: frames
  seed: 0

training:
  batch_size: 4
  epochs: 20
  lr: 0.0001
  weight_decay: 0.0001
  num_workers: 4
  device: cuda
  save_dir: outputs/ddtr
