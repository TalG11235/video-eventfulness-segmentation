task: fall_detection

model:
  input_type: features
  feature_dim: 512
  temporal_dim: 256
  ms_kernel_sizes: [3, 5, 7]
  ms_dilations: [1, 2, 3]
  dropout: 0.1

data:
  dataset: fall_detection
  clip_len: 128
  random_start: true
  input_type: features
  seed: 0

training:
  batch_size: 8
  epochs: 50
  lr: 0.0001
  weight_decay: 0.0001
  num_workers: 0
  device: cuda
  save_dir: outputs/fall_detection
